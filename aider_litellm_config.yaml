model_list:
  - model_name: qwen-architect
    litellm_params:
      model: custom_openai/qwen-architect
      api_base: http://127.0.0.1:8080/v1
      api_key: sk-local
  - model_name: qwen-editor
    litellm_params:
      model: custom_openai/qwen-editor
      api_base: http://127.0.0.1:8081/v1
      api_key: sk-local

router_settings:
  routing_strategy: simple-shuffle
  model_group_alias:
    "openai/qwen-architect": "qwen-architect"
    "openai/qwen-editor": "qwen-editor"

general_settings:
  master_key: sk-local
  disable_health_check: true
